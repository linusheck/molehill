name: Run Pytest

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '*' ]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie


    steps:

    - name: Install base dependencies
      run: |
        apt-get update
        apt-get install -y git lsb-release ca-certificates curl git

    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        cache: pip

    - name: Install system build dependencies
      run: |
        apt-get update
        apt-get install -y build-essential cmake libboost-dev libgmp-dev libcln-dev libginac-dev

    - name: Create virtual environment
      run: |
        python -m venv venv
        ./venv/bin/python -m pip install --upgrade pip

    - name: Install molehill
      run: |
        ./venv/bin/python -m pip install .

    - name: Install test requirements
      run: |
        ./venv/bin/python -m pip install matplotlib numpy scipy pytest nbval

    - name: Run tests
      run: |
        ./venv/bin/python -m pytest tests/
