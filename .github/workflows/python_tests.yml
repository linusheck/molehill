name: Run Pytest

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '*' ]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        cache: pip

    - name: Install system build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libboost-dev libgmp-dev libcln-dev libginac13 libginac13-dbgsym

    - name: Create virtual environment
      run: |
        python -m venv venv
        ./venv/bin/python -m pip install --upgrade pip

    - name: Install molehill
      run: |
        ./venv/bin/python -m pip install .

    - name: Install test requirements
      run: |
        ./venv/bin/python -m pip install matplotlib numpy scipy pytest nbval

    - name: Run tests
      run: |
        ./venv/bin/python -m pytest tests/
